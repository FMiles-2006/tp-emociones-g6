[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-emociones"
version = "0.1.0"
description = "TP IAyAA II (UCA Rosario 2026) - Grupo 6: identidad y emoción de actores argentinos"
requires-python = ">=3.10"
# TensorFlow/Keras no se declaran: Colab ya los trae y reinstalarlos rompe su versión con GPU.
dependencies = ["numpy", "pandas", "pillow", "scikit-learn", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tp_emociones = ["recursos/*.csv"]
